<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache">
<title>Минус-слова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --hint:#777; --card:#f4f5f7; --line:#e3e5e8; --btn:#2481cc; --btnfg:#fff; --ok:#2e9e5b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); padding:12px 12px 96px; }
  h1 { font-size:18px; margin:4px 0 2px; }
  .sub { color:var(--hint); font-size:13px; margin:0 0 12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--hint); margin:16px 0 6px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px; user-select:none; }
  .box { flex:0 0 28px; height:28px; border-radius:8px; border:2px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .row.on .box { background:var(--ok); border-color:var(--ok); color:#fff; }
  .row.seen { margin-top:16px; background:transparent; border:2px dashed var(--line); }
  .w { font-weight:600; }
  .t { color:var(--hint); font-weight:400; }
  .s { font-size:12px; color:var(--hint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--hint); padding:40px 0; text-align:center; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--bg); border-top:1px solid var(--line); display:flex; gap:8px; }
  button { flex:1; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:600; }
  #apply { background:var(--btn); color:var(--btnfg); }
  #cancel { background:var(--card); color:var(--fg); flex:0 0 38%; }
  button:disabled { opacity:.45; }
  #tabs { display:none; gap:4px; background:var(--card); border-radius:12px; padding:4px; margin:8px 0 12px; }
  #tabs div { flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-weight:600; font-size:14px; color:var(--hint); }
  #tabs div.on { background:var(--bg); color:var(--fg); }
  .head { font-size:14px; margin:0 0 12px; }
  .todo { background:var(--card); border-radius:12px; padding:12px 14px; margin:0 0 14px; }
  .todo h3 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--hint); }
  .todo div { font-size:15px; font-weight:600; padding:5px 0; overflow-wrap:anywhere; }
  .todo div + div { border-top:1px solid var(--line); }
  .todo .ok { color:var(--ok); } .todo .bad { color:#d64545; }
  .head b { font-size:17px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px; border-left:5px solid var(--line); }
  .card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card .k { font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .chip { flex:0 0 auto; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; white-space:nowrap; }
  .card .n { font-size:13px; color:var(--hint); margin-top:4px; }
  .card .do { font-size:14px; font-weight:600; margin-top:6px; }
  .v-e { border-left-color:#d64545; } .v-e .chip { background:#d64545; } .v-e .do { color:#d64545; }
  .v-z { border-left-color:#d9a400; } .v-z .chip { background:#d9a400; }
  .v-r, .v-n { border-left-color:#8a8f98; } .v-r .chip, .v-n .chip { background:#8a8f98; }
  .v-h { border-left-color:var(--ok); } .v-h .chip { background:var(--ok); }
  .card.waste { border-left-color:#d64545; }
  .card .badge { display:inline-block; font-size:11px; font-weight:700; color:#d64545; border:1px solid #d64545; border-radius:6px; padding:1px 6px; margin-top:4px; }
  .card.grow { border-left-color:var(--ok); }
  .card.grow .do { color:var(--ok); }
  #pause { background:#d64545; color:#fff; }
  .bid { background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px; border-left:5px solid var(--line); }
  .bid .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .bid .k { font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .bid .do { font-size:14px; font-weight:600; }
  .bid .row2, .grow .row2 { display:flex; align-items:center; gap:12px; margin-top:8px; user-select:none; }
  .rf { color:inherit; font-weight:700; text-decoration:underline; white-space:nowrap; }
  .stale { background:#d9a400; color:#1b1b1b; border-radius:10px; padding:10px 12px; margin:0 0 10px; font-weight:600; font-size:14px; }
  #toast { position:fixed; left:12px; right:12px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:600; display:none; z-index:5; }
  #toast.ok { background:var(--ok); color:#fff; } #toast.err { background:#d64545; color:#fff; }
  #toast button { flex:none; width:auto; display:inline; background:transparent; color:inherit; text-decoration:underline; padding:0; margin-left:8px; font-size:14px; font-weight:700; }
  .bid.b-m, .bid.b-u, .bid.b-x { border-left-color:#d64545; } .bid.b-d { border-left-color:#e67e22; } .bid.b-n, .bid.b-f { border-left-color:#8a8f98; } .bid.b-o, .bid.b-c { border-left-color:var(--ok); } .bid.b-t, .bid.b-w { border-left-color:#d9a400; } .bid.b-p { border-left-color:var(--btn); }
  .bid .chip { background:#8a8f98; } .bid.b-m .chip, .bid.b-u .chip, .bid.b-x .chip { background:#d64545; } .bid.b-d .chip { background:#e67e22; }
  .bid.b-o .chip, .bid.b-c .chip { background:var(--ok); } .bid.b-t .chip, .bid.b-w .chip { background:#d9a400; } .bid.b-p .chip { background:var(--btn); }
  .nums { display:flex; gap:6px; margin-top:8px; }
  .nums div { flex:1; background:var(--bg); border-radius:9px; padding:6px 4px; text-align:center; font-size:12px; color:var(--hint); }
  .nums b { display:block; font-size:16px; color:var(--fg); }
  .camp { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:13px 12px; margin-bottom:8px; border-left:5px solid var(--line); user-select:none; }
  .camp .body { flex:1; min-width:0; }
  .camp .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .camp .n { font-size:13px; color:var(--hint); margin-top:3px; }
  .camp .go { color:var(--hint); font-size:20px; }
  .camp .chip { align-self:flex-start; }
  .s3, .s2 { border-left-color:#d64545; } .s3 .chip, .s2 .chip { background:#d64545; }
  .s1 { border-left-color:#2481cc; } .s1 .chip { background:#2481cc; }
  .s0 { border-left-color:var(--ok); } .s0 .chip { background:var(--ok); }
  #back { display:none; color:var(--btn); font-weight:600; font-size:15px; padding:4px 0 8px; }
</style>
</head>
<body>
<div id="back">‹ Кампании</div>
<h1 id="title">Минус-слова</h1>
<div id="tabs"><div data-t="w">Слова</div><div data-t="r">Рекомендации</div><div data-t="b">Ставки</div></div>
<p class="sub" id="sub">Отметь, что убрать из показов. Отмеченное уйдёт в кабинет после «Применить».</p>
<div id="list"></div>
<div id="toast"></div>
<div id="bar">
  <button id="cancel">Отмена</button>
  <button id="apply">Применить</button>
  <button id="pause" style="display:none">⏸ Пауза</button>
</div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var API = 'https://ulya.dacutavio.ru'; // 22.09.2026: свой домен за Cloudflare — прямой канал из РФ до IP хостинга режет ответ после ~16 КБ; старый https://165-22-76-154.sslip.io жив как запасной
  // Через Cloudflare из РФ часть соединений замирает после первых КБ (22.09: 24 КБ висит, 400 КБ проходит, через минуту наоборот).
  // Зависшее соединение браузер переиспользует, поэтому повтор идёт на ДРУГОЕ имя — это новое соединение и новый адрес Cloudflare.
  var API_HOSTS = ['https://ulya.dacutavio.ru', 'https://ulya2.dacutavio.ru', 'https://ulya3.dacutavio.ru'];
  var initData = (tg && tg.initData) || '';
  function theme() {
    if (!tg || !tg.themeParams) return;
    var p = tg.themeParams, r = document.documentElement.style;
    if (p.bg_color) r.setProperty('--bg', p.bg_color);
    if (p.text_color) r.setProperty('--fg', p.text_color);
    if (p.hint_color) r.setProperty('--hint', p.hint_color);
    if (p.secondary_bg_color) r.setProperty('--card', p.secondary_bg_color);
    if (p.button_color) r.setProperty('--btn', p.button_color);
    if (p.button_text_color) r.setProperty('--btnfg', p.button_text_color);
  }
  theme();
  if (tg) tg.onEvent('themeChanged', theme);

  var list = document.getElementById('list'), apply = document.getElementById('apply');
  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).style.display = on ? '' : 'none'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function num(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function tap() { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }
  function fail(msg) {
    list.innerHTML = '<div class="empty">' + msg + '</div>';
    show('bar', false); show('sub', false);
  }
  // Ответ сервера — чужой HTML: экранируем всё через esc(), затем возвращаем разрешённый
  // минимум тегов (b/i/code/br). Не regex-парсинг HTML — просто обратная замена жёстко
  // заданных экранированных форм, поэтому произвольный <img onerror> остаётся текстом.
  function safeHtml(s) {
    return esc(s)
      .replace(/&lt;(\/?)(b|i|code)&gt;/g, '<$1$2>')
      .replace(/\n/g, '<br>');
  }
  var toastTimer = null;
  function toast(html, kind) {
    var t = $('toast');
    clearTimeout(toastTimer);
    t.className = kind === 'ok' ? 'ok' : 'err';
    t.innerHTML = html;
    t.style.display = 'block';
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 6000);
  }

  // Данные едут в ссылке. ?z= — все кампании, deflate-raw + base64url (главный экран);
  // ?d= — одна кампания без сжатия (старые кнопки и запасной вход). Не в #: Telegram
  // подменяет фрагмент своим #tgWebAppData=… и пачка терялась.
  function bytes(b64) {
    var bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function load() {
    var q = new URLSearchParams(location.search), z = q.get('z'), d = q.get('d');
    if (z) {
      if (!window.DecompressionStream) return Promise.reject('old');
      var st = new Blob([bytes(z)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(st).text().then(function (t) { var o = JSON.parse(t); (o.c || []).forEach(function (c) { if (o.t && !c.t) c.t = o.t; }); return o.c; });
    }
    return Promise.resolve(d ? [JSON.parse(new TextDecoder().decode(bytes(d)))] : null);
  }

  var all = [], data = null, items = [], cards = [], grow = [], bids = [], bidOn = {}, growOn = {}, tab = 'w', seen = false;
  var VERD = { e: 'Дорого', z: 'Без заказов', r: 'Рано судить', n: 'Нет маржи', h: 'Держать' };
  var mode = 'link'; // 'server' — данные и действия через API; 'link' — запасной, как раньше (?z=/?d=, sendData)

  // ---- режим сервера: авторизация подписью Telegram, без своих токенов/cookies
  // Таймауты: состояние на холодном кэше сервер собирает ~6–10 с (7 кампаний, перевод новых слов) — даём 25 с;
  // действие отвечает быстро, но шлёт сообщение в Telegram — 15 с. Дальше кэш сервера (90 с) отдаёт мгновенно.
  function fetchStateOnce(host, ms) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms);
    return fetch(host + '/api/state', { headers: { 'X-Tg-Init-Data': initData }, signal: ctl.signal })
      .then(function (r) {
        if (r.status === 401) return Promise.reject('auth');
        if (!r.ok) return Promise.reject('http');
        return r.json();                                   // тело тоже под таймером: зависает именно тело, не заголовки
      })
      .then(function (o) {
        clearTimeout(timer);
        var c = o.c || [];
        c.forEach(function (x) { if (o.t && !x.t) x.t = o.t; });
        return c;
      }, function (e) { clearTimeout(timer); return Promise.reject(e === 'auth' ? 'auth' : e === 'http' ? 'http' : (e && e.name === 'AbortError' ? 'timeout' : 'net')); });
  }
  // Первая попытка 15 с (холодная сборка на сервере 6–10 с), повторы по 12 с на других именах: дальше сервер отдаёт из кэша за миллисекунды,
  // так что долгий повтор = снова зависшая доставка, а не сервер. 'auth'/'http' не повторяем — это не сеть.
  function fetchStateDirect() {
    var attempt = 0;
    function go() {
      var host = API_HOSTS[attempt % API_HOSTS.length], ms = attempt === 0 ? 15000 : 12000;
      attempt += 1;
      return fetchStateOnce(host, ms).catch(function (e) {
        if ((e === 'timeout' || e === 'net') && attempt < API_HOSTS.length) {
          list.innerHTML = '<div class="empty">Связь застряла, пробую ещё раз (' + (attempt + 1) + ' из ' + API_HOSTS.length + ')…</div>';
          return go();
        }
        return Promise.reject(e);
      });
    }
    return go();
  }

  // ---- состояние через GitHub Gist (22.09.2026, uzum-app-state-via-github.md): большие ответы сервера
  // срезаются из РФ после ~16 КБ, GitHub грузится всегда. Сервер отдаёт маленькую ссылку+ключ (/api/state_ref),
  // само тело — зашифрованный файл с GitHub. Любой сбой на пути (а)-(в) → тихо назад на старый /api/state.
  function fetchRef(fresh) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 20000);
    var url = API + '/api/state_ref' + (fresh ? '?fresh=1' : '');
    return fetch(url, { headers: { 'X-Tg-Init-Data': initData }, signal: ctl.signal })
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401) return Promise.reject('auth');
        if (!r.ok) return Promise.reject('http');
        return r.json();
      }, function (e) { clearTimeout(timer); return Promise.reject(e && e.name === 'AbortError' ? 'timeout' : 'net'); });
  }
  function fetchGistBody(url) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 20000);
    return fetch(url, { signal: ctl.signal })                // без своих заголовков — CORS gist raw отдаёт *, свои заголовки его бы сломали
      .then(function (r) { clearTimeout(timer); if (!r.ok) return Promise.reject('http'); return r.text(); },
            function (e) { clearTimeout(timer); return Promise.reject(e && e.name === 'AbortError' ? 'timeout' : 'net'); });
  }
  function decryptState(b64, keyB64) {
    var raw = bytes(b64), nonce = raw.slice(0, 12), ct = raw.slice(12);
    return crypto.subtle.importKey('raw', bytes(keyB64), 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function fetchStateViaGist(fresh) {
    return fetchRef(fresh).then(function (ref) {
      return fetchGistBody(ref.u).then(function (b64) { return decryptState(b64, ref.k); })
        .then(function (o) {
          var c = o.c || [];
          c.forEach(function (x) { if (o.t && !x.t) x.t = o.t; });
          return c;
        });
    });
  }
  // Главный путь: сервер публикует состояние в Gist → приложение читает его напрямую с GitHub. Сбой
  // на любом шаге (ссылка сервера, GitHub, расшифровка) — тихо на старый прямой путь /api/state.
  function fetchState(fresh) {
    return fetchStateViaGist(fresh).catch(function () {
      list.innerHTML = '<div class="empty">GitHub не ответил, пробую сервер…</div>';
      return fetchStateDirect();
    });
  }

  // 3 — ДРР кампании выше предела, 2 — есть «дорого» или «сливает» (w=1), 1 — есть слова, 0 — спокойно
  function sev(c) {
    var hd = c.hd || [];
    if (hd[2] != null && hd[3] != null && hd[2] > hd[3]) return 3;
    if ((c.k || []).some(function (x) { return x[4] === 'e' || x[6]; })) return 2;
    return (c.i || []).length ? 1 : 0;
  }

  // Данные вшиты в ссылку и сами не обновляются: показываем, на какое время они собраны, и предупреждаем о старых.
  // t — минуты эпохи; в старых ссылках его нет — тогда честно говорим, что список из старого сообщения.
  function freshness(t) {
    var btn = ' <a href="#" class="rf" onclick="return false">↻ Обновить</a>';
    if (!t) return '<div class="stale">Список из старого сообщения — ключи и ставки могли измениться.' + btn + '</div>';
    var age = Math.round(Date.now() / 60000 - t), d = new Date(t * 60000);
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return age > 60 ? '<div class="stale">Данные на ' + hm + ' — списку больше часа, ключи и ставки могли измениться.' + btn + '</div>'
                    : '<p class="head" style="margin-top:-4px">Данные на ' + hm + ' ·' + btn + '</p>';
  }

  // ---- главный экран: список кампаний, проблемные сверху
  function home() {
    data = null;
    if (tg && tg.BackButton) tg.BackButton.hide();
    show('back', false); show('tabs', false); show('sub', false); show('bar', false);
    var total = all.reduce(function (s, c) { return s + ((c.hd || [])[0] || 0); }, 0);
    $('title').textContent = 'Реклама Uzum';
    list.innerHTML = freshness((all[0] || {}).t) + '<p class="head">Расход по отчётам <b>' + num(total) + '</b> сум · кампаний ' + all.length + '</p>';
    all.map(function (c, i) { return [c, i]; })
      .sort(function (a, b) { return sev(b[0]) - sev(a[0]) || ((b[0].hd || [])[0] || 0) - ((a[0].hd || [])[0] || 0); })
      .forEach(function (p) {
        var c = p[0], s = sev(c), hd = c.hd || [], w = (c.i || []).length;
        var bad = (c.k || []).filter(function (x) { return x[4] === 'e'; }).length;
        var waste = (c.k || []).filter(function (x) { return x[6]; }).length;
        var lbl2 = bad ? 'Дорого' + (bad > 1 ? ' · ' + bad : '') : 'Сливает' + (waste > 1 ? ' · ' + waste : '');
        var chip = s === 3 ? 'ДРР ' + hd[2] + '%' : s === 2 ? lbl2 : s === 1 ? 'Слова · ' + w : 'Спокойно';
        var nums = hd.length ? num(hd[0]) + ' сум · ' + hd[1] + ' зак' +
          (hd[2] != null && s !== 3 ? ' · ДРР ' + hd[2] + '%' : '') + (s === 3 ? ' · предел ' + hd[3] + '%' : '') : '';
        if (w && s !== 1) nums += (nums ? ' · ' : '') + 'слов: ' + w;
        if (c.ph && c.ph[2]) nums += (nums ? ' · ' : '') + 'органика ' + c.ph[2] + '-е';
        if (c.a) nums += (nums ? ' · ' : '') + '🤖 авто';
        var d = document.createElement('div');
        d.className = 'camp s' + s;
        d.innerHTML = '<div class="body"><div class="nm">' + esc(c.n || '?') + '</div><div class="n">' + nums + '</div></div>' +
          '<div class="chip">' + chip + '</div><div class="go">›</div>';
        d.onclick = function () { tap(); open(p[1]); };
        list.appendChild(d);
      });
    window.scrollTo(0, 0);
  }

  function open(i) {
    data = all[i];
    // i: [слово, перевод, показы, пример, tier(c|s), checked]
    items = (data.i || []).map(function (x) { return { w: x[0], t: x[1], s: x[2], q: x[3], tier: x[4], on: !!x[5] }; });
    cards = data.k || [];
    grow = data.g || [];
    bids = data.s || []; bidOn = {}; growOn = {};
    tab = items.length ? 'w' : (cards.length ? 'r' : 'b'); seen = false;
    $('title').textContent = data.n || 'Минус-слова';
    show('bar', true);
    if (all.length > 1) {

        '<div><b>' + (b[3] || '—') + '</b>без рекламы</div><div><b>' + b[4] + '</b>зак · ' + num(b[5]) + '</div></div>' +
        drrLine(b) +
        (pick ? '<div class="row2"><div class="box"></div><div class="do">' + what + '</div></div>' : '<div class="do" style="margin-top:8px">' + what + '</div>') +
        (whyText ? '<details style="margin-top:6px;font-size:12px;color:var(--hint)"><summary style="cursor:pointer">почему</summary><div style="margin-top:4px;line-height:1.4">' + esc(whyText) +
          (code === 'w' && b[4] ? ' За неделю ' + b[4] + ' зак.' : '') + '</div></details>' : '');
      if (pick) {
        var row = d.querySelector('.row2'), box = d.querySelector('.box');
        var paint = function () { box.textContent = bidOn[b[8]] ? '✓' : ''; box.style.background = bidOn[b[8]] ? 'var(--ok)' : ''; box.style.borderColor = bidOn[b[8]] ? 'var(--ok)' : ''; box.style.color = '#fff'; };
        row.onclick = function () { bidOn[b[8]] = !bidOn[b[8]]; tap(); paint(); bar(); };
        paint();
      }
      (code === 'f' ? offBox : list).appendChild(d);      // выключенные — в сворачиваемый блок, иначе 12 серых карточек подряд
    });
    var offN = offBox.children.length;
    if (offN) {
      var sm = document.createElement('summary');
      sm.style.cssText = 'font-weight:600;padding:10px 4px;cursor:pointer';
      sm.textContent = 'Выключенные ключи · ' + offN + ' — можно вернуть галкой';
      offBox.insertBefore(sm, offBox.firstChild);
      list.appendChild(offBox);
    }
    // «Все ключи»: в ссылку названия всех ключей не влезают — Уля пришлёт полный список таблицей в чат
    var kb = document.createElement('button');
    kb.style.cssText = 'margin:6px 0 2px;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:15px;background:transparent;color:var(--fg)';
    kb.textContent = '📋 Все ключи кампании — списком в чат';
    kb.onclick = function () { tap(); send({ keys: true }); };
    list.appendChild(kb);
    if (data.un) {
      var u = document.createElement('div'); u.className = 'empty';
      u.textContent = 'Ещё не проверены: ' + data.un + ' ключей — показов почти нет, отключать рано';
      list.appendChild(u);
      if (data.un_names && data.un_names.length) {
        var det = document.createElement('details'); det.style.cssText = 'margin:-6px 0 12px;font-size:13px;color:var(--hint)';
        det.innerHTML = '<summary>показать названия</summary>' + data.un_names.map(esc).join(', ');
        list.appendChild(det);
      }
    }
    if (data.sr > 0) { var m = document.createElement('div'); m.className = 'empty'; m.textContent = 'ещё ' + data.sr + ' ключей — держим или мало данных'; list.appendChild(m); }
    bar();
  }
  function paintGrowBtn() {
    var b = document.getElementById('growApply'); if (!b) return;
    var n = Object.keys(growOn).filter(function (k) { return growOn[k]; }).length;
    b.textContent = n ? 'Завести (' + n + ') — подтверждение в чате' : 'Отметь запрос выше';
    b.disabled = !n; b.style.opacity = n ? '1' : '.5';
  }
  function bar() {
    if (tab !== 'b') return;
    show('apply', bids.some(function (b) { return 'dpxoumf'.indexOf(b[6]) >= 0; }));
    var n = Object.keys(bidOn).filter(function (k) { return bidOn[k]; }).length;
    // счётчик по видам действий — чтобы «отключить» не ушло незамеченным рядом со «снизить»
    var cnt = { d: 0, p: 0, off: 0, m: 0 };
    bids.forEach(function (b) { if (bidOn[b[8]]) cnt['xou'.indexOf(b[6]) >= 0 ? 'off' : b[6] === 'f' ? 'm' : b[6]]++; });
    var parts = [];
    if (cnt.d) parts.push('⬇' + cnt.d); if (cnt.p) parts.push('⬆' + cnt.p); if (cnt.off) parts.push('✖' + cnt.off); if (cnt.m) parts.push('↩' + cnt.m);
    apply.textContent = !n ? 'Отметь, что сделать' : (cnt.d === n ? 'Снизить ставки (' + n + ')' : 'Выполнить: ' + parts.join(' '));
    apply.disabled = !n;
  }

  function hasB() { return bids.length || (data && (data.a || data.un)); }   // авто включено — вкладка нужна и без советов: иначе его не выключить
  function render() {
    var tabsN = (items.length ? 1 : 0) + (cards.length ? 1 : 0) + (hasB() ? 1 : 0);
    $('tabs').style.display = tabsN > 1 ? 'flex' : 'none';
    [].forEach.call(document.querySelectorAll('#tabs div'), function (t) {
      var k = t.getAttribute('data-t');
      t.style.display = (k === 'w' && !items.length) || (k === 'r' && !cards.length) || (k === 'b' && !hasB()) ? 'none' : '';
    });
    if (tab === 'b') {
      [].forEach.call(document.querySelectorAll('#tabs div'), function (t) { t.className = t.getAttribute('data-t') === tab ? 'on' : ''; });
      show('sub', false); show('cancel', false); show('apply', true); show('pause', false);
      renderBids(); return;
    }
    [].forEach.call(document.querySelectorAll('#tabs div'), function (t) { t.className = t.getAttribute('data-t') === tab ? 'on' : ''; });
    var rec = tab === 'r';
    show('sub', !rec); show('cancel', !rec); show('apply', !rec);
    // Пауза глушит ВСЮ кампанию, включая кластеры, которые продают. Поэтому кнопка есть,
    // только когда кампания в целом за пределом ДРР; нет ДРР — когда есть «дорого».
    var hd = data.hd || [], over = hd[2] != null && hd[3] != null ? hd[2] > hd[3]
      : cards.some(function (c) { return c[4] === 'e'; });
    show('pause', rec && over);
    if (rec) { renderCards(); return; }
    list.innerHTML = freshness(data.t);
    [['c', 'Уверен — сними лишнее'], ['s', 'Сомневаюсь — отметь нужное']].forEach(function (g) {
      var rows = items.map(function (it, i) { return [it, i]; }).filter(function (p) { return p[0].tier === g[0]; });
      if (!rows.length) return;
      var h = document.createElement('h2'); h.textContent = g[1]; list.appendChild(h);
      rows.forEach(function (p) {
        var it = p[0], d = document.createElement('div');
        d.className = 'row' + (it.on ? ' on' : '');
        d.innerHTML = '<div class="box">' + (it.on ? '✓' : '') + '</div>' +
          '<div style="min-width:0;flex:1"><div class="w">' + esc(it.w) + ' <span class="t">— ' + esc(it.t || '?') + '</span></div>' +
          '<div class="s">' + it.s + ' пок.' + (it.q ? ' · «' + esc(it.q) + '»' : '') + '</div></div>';
        d.onclick = function () { it.on = !it.on; tap(); render(); };
        list.appendChild(d);
      });
    });
    var n = items.filter(function (i) { return i.on; }).length;
    if (n < items.length) {
      // В конце списка: дошла сюда — значит, всё просмотрела
      var d = document.createElement('div');
      d.className = 'row seen' + (seen ? ' on' : '');
      d.innerHTML = '<div class="box">' + (seen ? '✓' : '') + '</div>' +
        '<div style="min-width:0;flex:1"><div class="w">Остальные — нормальные</div>' +
        '<div class="s">больше не показывать, пока показы не вырастут вдвое</div></div>';
      d.onclick = function () { seen = !seen; tap(); render(); };
      list.appendChild(d);
    }
    apply.textContent = n ? 'Применить (' + n + ')' : (seen ? 'Сохранить' : 'Ничего не отмечено');
    apply.disabled = !n && !seen;
  }

  [].forEach.call(document.querySelectorAll('#tabs div'), function (t) {
    t.onclick = function () { tab = t.getAttribute('data-t'); render(); window.scrollTo(0, 0); };
  });
  // «Обновить»: в режиме сервера — повторный GET на месте, без закрытия приложения.
  // В запасном режиме сервера нет — просим Улю прислать свежую ссылку (приложение закроется).
  document.addEventListener('click', function (e) {
    if (e.target && e.target.className === 'rf') {
      e.preventDefault(); tap();
      if (mode === 'server') refreshInPlace(); else send({ refresh: true });
    }
  });
  function refreshInPlace() {
    var curName = data && data.n, wasHome = !data, curTab = tab;
    var prevList = list.innerHTML;
    list.innerHTML = '<div class="empty">Обновляю…</div>';
    fetchState(true).then(function (c) {
      all = c || [];
      if (wasHome || all.length <= 1) { if (all.length === 1) open(0); else home(); return; }
      var idx = 0;
      for (var i = 0; i < all.length; i++) if (all[i].n === curName) { idx = i; break; }
      open(idx);
      if (items.length || cards.length || hasB()) tab = (tab === 'w' && !items.length) || (tab === 'r' && !cards.length) || (tab === 'b' && !hasB()) ? tab : curTab;
      render();
    }, function (e) {
      list.innerHTML = prevList;
      toast(e === 'auth' ? 'Подпись устарела — открой приложение заново из меню Ули.' : 'Сервер не ответил, попробуй ещё раз.', 'err');
    });
  }
  function send(o) {
    o.b = (data || all[0] || {}).b;
    if (mode === 'server') { sendServer(o); return; }
    var p = JSON.stringify(o);
    if (tg && tg.sendData) tg.sendData(p); else alert(p);
  }
  function sendServer(o) {
    apply.disabled = true;
    var prevText = apply.textContent;
    apply.textContent = 'Отправляю…';
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 15000);
    fetch(API + '/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Tg-Init-Data': initData },
      body: JSON.stringify(o), signal: ctl.signal
    }).then(function (r) {
      clearTimeout(timer);
      if (r.status === 401) return Promise.reject('auth');
      return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; });
    }).then(function (res) {
      var j = res.j || {};
      if (res.r.status === 429) {     // лимит сервера — не сбой: «попробуй ещё раз» тут только усугубит
        toast(j.error === 'too_many_confirms' ? 'Слишком много запросов подряд — подожди 10 минут. Подтверждения уже лежат в чате с Улей.'
                                              : 'Слишком часто — подожди минуту.', 'err');
        afterSend(o, false); return;
      }
      if (!res.r.ok || j.ok === false) { toast(safeHtml(j.error || 'Сервер не ответил, попробуй ещё раз.'), 'err'); afterSend(o, false); return; }
      var html = j.text ? safeHtml(j.text) : 'Готово.';
      if (j.chat) html += '<br>→ подтверди кнопкой в чате с Улей' + (tg && tg.close ? ' <button id="toChat">Перейти в чат</button>' : '');
      toast(html, 'ok');
      if (tg && tg.close) { var tb = $('toast').querySelector('#toChat'); if (tb) tb.onclick = function () { tg.close(); }; }
      afterSend(o, !!j.refresh);
    }, function (e) {
      toast(e === 'auth' ? 'Подпись устарела — открой приложение заново из меню Ули.' : 'Сервер не ответил, попробуй ещё раз.', 'err');
      afterSend(o, false);
    });
    function afterSend(o, forceRefresh) {
      apply.disabled = false; apply.textContent = prevText;
      var needsRefresh = forceRefresh || o.cancel || o.checked || o.repricer === false;   // остановка репрайсера исполняется сразу — перечитать состояние
      if (needsRefresh) refreshInPlace();
    }
  }
  // Пауза и справка только ПРОСЯТ бота: пауза исполняется кнопкой подтверждения в чате
  $('pause').onclick = function () { send({ pause: true }); };
  apply.onclick = function () {
    if (tab === 'b') {       // ставки: шлём только номера строк — ключи и цифры бот берёт из своей базы
      send({ bids: Object.keys(bidOn).filter(function (k) { return bidOn[k]; }).map(Number) });
      return;
    }
    var checked = items.map(function (it, i) { return it.on ? i : -1; }).filter(function (i) { return i >= 0; });
    send({ checked: checked, seen: seen && checked.length < items.length });
  };
  $('cancel').onclick = function () { if (all.length > 1) home(); else send({ cancel: true }); };
  $('back').onclick = home;
  if (tg && tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(home);

  function boot(list_) {
    all = (list_ || []).filter(function (x) { return x && ((x.i && x.i.length) || (x.k && x.k.length) || (x.s && x.s.length) || x.a); });
    if (!all.length) return fail('Список не загрузился. Закрой и открой заново из сообщения бота.');
    if (all.length === 1) open(0); else home();
  }
  function retryScreen(msg) {
    list.innerHTML = '<div class="empty">' + esc(msg) + '<br><button id="retry" style="margin-top:14px;width:auto;padding:11px 22px;border:0;border-radius:10px;font-weight:600;background:var(--btn);color:var(--btnfg)">Повторить</button></div>';
    show('bar', false); show('sub', false);
    $('retry').onclick = startServer;
  }
  function startServer() {
    list.innerHTML = '<div class="empty">Загружаю свежие данные…<br><span style="font-size:13px">первый раз за день — до 10 секунд</span></div>';
    fetchState().then(function (c) { mode = 'server'; boot(c); }, function (e) {
      load().then(function (c) {   // сервер недоступен — если в ссылке есть данные, тихо уходим в запасной режим
        if (c && c.length) {
          mode = 'link';
          boot(c);
          var pl = document.createElement('div'); pl.className = 'stale';
          pl.textContent = 'Сервер не ответил — показываю данные из ссылки.';
          list.insertBefore(pl, list.firstChild);
        } else if (e === 'auth') {
          fail('Подпись устарела. Открой приложение заново из меню Ули.');
        } else {
          retryScreen('Не получилось загрузить данные. Проверь VPN и открой ещё раз.');
        }
      }, function () {
        if (e === 'auth') fail('Подпись устарела. Открой приложение заново из меню Ули.');
        else retryScreen('Не получилось загрузить данные. Проверь VPN и открой ещё раз.');
      });
    });
  }

  if (initData) {
    startServer();
  } else {
    var q0 = new URLSearchParams(location.search);
    if (q0.get('api') === '1' && !q0.get('z') && !q0.get('d')) {
      fail('Открой приложение из Telegram — кнопкой меню у Ули.');
    } else {
      load().then(boot, function (e) {
        fail(e === 'old' ? 'Этот телефон не умеет открыть общий список. Напиши боту «минус-слова» и название кампании — откроется одна кампания.'
                         : 'Список не загрузился. Закрой и открой заново из сообщения бота.');
      });
    }
  }
})();
</script>
