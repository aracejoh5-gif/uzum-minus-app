<!doctype html>

<head>

<title>Минус-слова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face { font-family:"Jost"; font-style:normal; font-weight:100 900; font-display:swap; src:url(fonts/jost-cyrillic.woff2) format('woff2'); unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  /* узбекская кириллица (ғ қ ҳ …) — у Jost её нет, берём Onest (11.10: «қўнғироқ» рисовался чужим шрифтом) */
  @font-face { font-family:"Jost"; font-style:normal; font-weight:100 900; font-display:swap; src:url(fonts/onest-cyrillic-ext.woff2) format('woff2'); unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
  @font-face { font-family:"Jost"; font-style:normal; font-weight:100 900; font-display:swap; src:url(fonts/jost-latin.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  /* Токены макета 11.10: светлая / тёмная тема выбирается по Telegram.WebApp.colorScheme (класс на <html>) */
  :root { --f:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  :root, :root.light { --bg:#f4f2ef; --page:radial-gradient(120% 55% at 0% 0%,#f1e7dc 0%,transparent 60%),linear-gradient(180deg,#f3f2f0 0%,#e6eaee 55%,#b9c7d4 100%);
    --card:rgba(255,255,255,.9); --card-solid:#fff; --fg:#1d1b19; --hint:#6d6863; --line:#e2ddd7;
    --acc:#f2762c; --acc-soft:#fde9dc; --ok:#1f9a57; --ok-soft:#e1f4e9; --bad:#d9415f; --bad-soft:#fbe3e8; --wait:#3b6fd8; --wait-soft:#e3ebfb; --idle:#8a847d; --idle-soft:#efece8;
    --btn:var(--acc); --btnfg:#fff; --on-bg:#fff; --on-fg:#1d1b19;
    --hero:radial-gradient(90% 120% at 0% 100%,#9a5524 0%,transparent 55%),radial-gradient(80% 100% at 100% 0%,#a06a40 0%,transparent 60%),linear-gradient(135deg,#a8683a 0%,#7c7f8a 60%,#5d7186 100%); --hero-on:#7a4a28;
    --minus:#6d6396; --minus-soft:#ebe8f3; }
  :root.dark { --bg:#121214; --page:radial-gradient(110% 55% at 0% 0%,#2a1f17 0%,transparent 60%),linear-gradient(180deg,#141517 0%,#151a20 60%,#1f2935 100%);
    --card:rgba(255,255,255,.07); --card-solid:#1c1c20; --fg:#f2f1ef; --hint:#a19d98; --line:#2b2b31;
    --acc:#ff8a3d; --acc-soft:#3a2416; --ok:#3ddc84; --ok-soft:#163223; --bad:#ff5c7a; --bad-soft:#3a1a22; --wait:#7aa7ff; --wait-soft:#1c2740; --idle:#8d8a86; --idle-soft:#2a2a2f; --minus:#b3a8e0; --minus-soft:#2a2740;
    --on-bg:rgba(255,255,255,.92);
    --hero:radial-gradient(90% 120% at 0% 100%,#a35d2a 0%,transparent 55%),radial-gradient(80% 100% at 100% 0%,#d39a62 0%,transparent 60%),linear-gradient(135deg,#7a4a28 0%,#3c4652 60%,#222a33 100%); }
  /* старые Android WebView Telegram без backdrop-filter: карточки сплошным цветом */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root, :root.light, :root.dark { --card:var(--card-solid); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; font:14px/1.4 var(--f); font-weight:400; font-synthesis:none; background:var(--page) var(--bg); background-attachment:fixed; color:var(--fg); padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px)); min-height:100vh; }
  .row, .card, .bid, .camp, .todo, .tile, .advice, .tl, .chips span, #tabs, .back i, #bar { -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  h1 { font-size:24px; font-weight:300; letter-spacing:-.02em; margin:6px 0 2px; }
  .sub { color:var(--hint); font-size:13px; font-weight:300; margin:0 0 12px; }
  h2 { font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:var(--hint); margin:16px 0 6px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:22px; padding:12px 14px; margin-bottom:8px; user-select:none; }
  .box { flex:0 0 28px; height:28px; border-radius:10px; border:2px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .row.on .box { background:var(--ok); border-color:var(--ok); color:#fff; }
  .row.seen { margin-top:16px; background:transparent; border:2px dashed var(--line); }
  .w { font-weight:500; }
  .t { color:var(--hint); font-weight:300; }
  .s { font-size:12px; font-weight:300; color:var(--hint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--hint); padding:40px 0; text-align:center; font-weight:300; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); display:flex; gap:8px; }

  /* вкладки — «пилюля» со счётчиками */
  #tabs { display:none; gap:2px; background:var(--card); border-radius:999px; padding:3px; margin:8px 0 12px; box-shadow:inset 0 0 0 1px var(--line); }
  #tabs div { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; text-align:center; padding:7px 4px; border-radius:999px; font-weight:400; font-size:12px; color:var(--hint); white-space:nowrap; }
  #tabs div.on { background:var(--on-bg); color:var(--on-fg,#1d1b19); font-weight:500; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #tabs em { font-style:normal; font-size:10px; font-weight:500; min-width:16px; height:16px; padding:0 4px; border-radius:999px; display:inline-grid; place-items:center; background:var(--acc); color:#fff; }
  .head { font-size:14px; font-weight:300; margin:0 0 12px; }
  .todo { background:var(--card); border-radius:22px; padding:12px 14px; margin:0 0 14px; }
  .todo h3 { margin:0 0 6px; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:var(--hint); }
  .todo div { font-size:15px; font-weight:500; padding:5px 0; overflow-wrap:anywhere; }
  .todo div + div { border-top:1px solid var(--line); }
  .todo .ok { color:var(--ok); } .todo .bad { color:var(--bad); }
  .head b { font-size:17px; font-weight:500; }
  .card { background:var(--card); border-radius:22px; padding:12px 14px; margin-bottom:8px; border-left:5px solid var(--line); }

  .card .k { font-weight:500; min-width:0; overflow-wrap:anywhere; }

  .card .n { font-size:13px; font-weight:300; color:var(--hint); margin-top:4px; }
  .card .do { font-size:14px; font-weight:500; margin-top:6px; }
  .v-e { border-left-color:var(--bad); } .v-e .chip { background:var(--bad); } .v-e .do { color:var(--bad); }
  .v-z { border-left-color:#d9a400; } .v-z .chip { background:#d9a400; }
  .v-r, .v-n { border-left-color:var(--idle); } .v-r .chip, .v-n .chip { background:var(--idle); }
  .v-h { border-left-color:var(--ok); } .v-h .chip { background:var(--ok); }
  .card.waste { border-left-color:var(--bad); }
  .card .badge { display:inline-block; font-size:11px; font-weight:500; color:var(--bad); border:1px solid var(--bad); border-radius:999px; padding:1px 7px; margin-top:4px; }
  .card.grow { border-left-color:var(--ok); }
  .card.grow .do { color:var(--ok); }
  #pause { background:var(--card-solid); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
  .bid { background:var(--card); border-radius:22px; padding:12px 14px; margin-bottom:8px; border-left:5px solid var(--line); }
  .bid .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .bid .k { font-weight:500; min-width:0; overflow-wrap:anywhere; }
  .bid .do { font-size:14px; font-weight:500; }
  .bid .row2, .grow .row2 { display:flex; align-items:center; gap:12px; margin-top:8px; user-select:none; }
  .rf { color:var(--acc,#f2762c); font-weight:400; text-decoration:none; white-space:nowrap; padding:2px 8px; border-radius:999px; background:var(--acc-soft,rgba(242,118,44,.12)); margin-left:4px; }
  .stale { background:#d9a400; color:#1b1b1b; border-radius:18px; padding:10px 14px; margin:0 0 10px; font-weight:500; font-size:14px; }
  #toast { position:fixed; left:12px; right:12px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); border-radius:18px; padding:10px 14px; font-size:14px; font-weight:500; display:none; z-index:5; }
  #toast.ok { background:var(--ok); color:#fff; } #toast.err { background:var(--bad); color:#fff; }
  #toast button { flex:none; width:auto; display:inline; background:transparent; color:inherit; text-decoration:underline; padding:0; margin-left:8px; font-size:14px; font-weight:500; }
  .bid.b-m, .bid.b-u, .bid.b-x { border-left-color:var(--bad); } .bid.b-d { border-left-color:var(--acc); } .bid.b-n, .bid.b-f { border-left-color:var(--idle); } .bid.b-o, .bid.b-c { border-left-color:var(--ok); } .bid.b-t, .bid.b-w { border-left-color:#d9a400; } .bid.b-p { border-left-color:var(--wait); }
  .bid .chip { background:var(--idle); } .bid.b-m .chip, .bid.b-u .chip, .bid.b-x .chip { background:var(--bad); } .bid.b-d .chip { background:var(--acc); }
  .bid.b-o .chip, .bid.b-c .chip { background:var(--ok); } .bid.b-t .chip, .bid.b-w .chip { background:#d9a400; } .bid.b-p .chip { background:var(--wait); }
  .nums { display:flex; gap:6px; margin-top:8px; }
  .nums div { flex:1; background:var(--bg); border-radius:14px; padding:6px 4px; text-align:center; font-size:12px; font-weight:300; color:var(--hint); }
  .nums b { display:block; font-size:16px; font-weight:500; color:var(--fg); }
  .camp { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:22px; padding:13px 14px; margin-bottom:8px; border-left:5px solid var(--line); user-select:none; }
  .camp .body { flex:1; min-width:0; }
  .camp .nm { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .camp .n { font-size:13px; font-weight:300; color:var(--hint); margin-top:3px; }
  .camp .go { color:var(--hint); font-size:20px; }
  .camp .chip { align-self:flex-start; }
  .s3, .s2 { border-left-color:var(--bad); } .s3 .chip, .s2 .chip { background:var(--bad); }
  .s1 { border-left-color:var(--wait); } .s1 .chip { background:var(--wait); }
  .s0 { border-left-color:var(--ok); } .s0 .chip { background:var(--ok); }
  #back { display:none; color:var(--acc); font-weight:500; font-size:15px; padding:4px 0 8px; }

  /* ---- «Ставки» v2: шапка, плитки, чипы, строки, экран ключа ---- */
  .hero { background:var(--hero); border-radius:30px; padding:16px; color:#fff; display:grid; gap:4px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
  .hero .t { font-size:11px; font-weight:300; letter-spacing:.02em; color:#fff; opacity:.9; }
  .hero .big { font-size:30px; font-weight:300; letter-spacing:-.02em; line-height:1.1; }
  .hero .sub { font-size:12px; font-weight:300; color:#fff; margin:0; }
  .ticks { display:flex; gap:6px; margin-top:4px; }
  .ticks span { flex:1; text-align:center; font-size:11px; font-weight:400; padding:4px 0; border-radius:999px; background:rgba(255,255,255,.22); }
  .ticks span.on { background:rgba(255,255,255,.92); color:var(--hero-on,#7a4a28); }
  .hero .nx { font-size:12px; font-weight:300; opacity:.95; margin-top:2px; }
  .hero { position:relative; }
  .hero .nx .rf { background:none; color:#fff; padding:0; text-decoration:underline; }
  .hero .hth { position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.85); color:#3a2a1e; font-size:12px; text-decoration:none; }
  .bento { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .bento.t3 { grid-template-columns:repeat(3,1fr); margin-top:0; }
  .tile { background:var(--card); border-radius:24px; padding:12px; display:grid; gap:2px; min-width:0; align-content:start; }
  .tile .l { font-size:10.5px; font-weight:300; line-height:1.2; color:var(--hint); }
  .tile .v { font-size:26px; font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .tile .n { font-size:10px; font-weight:300; color:var(--hint); }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:12px 0 8px; padding-bottom:2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .rkb { display:flex; gap:8px; } .rkb span { cursor:pointer; padding:6px 10px; border-radius:999px; box-shadow:0 0 0 1px var(--line); font-size:13px; }
  .zseg { display:flex; gap:6px; margin:6px 0 2px; }
  .zseg span { flex:1; text-align:center; font-size:14px; padding:8px 0; border-radius:999px; background:var(--bg); color:var(--fg); box-shadow:0 0 0 1px var(--line); cursor:pointer; }
  .zseg span.on { background:var(--ok); color:#fff; box-shadow:none; }
  .chips span { flex:0 0 auto; font-size:11.5px; font-weight:400; padding:5px 10px; border-radius:999px; background:var(--card); color:var(--hint); }
  .chips span.on { background:var(--acc); color:#fff; font-weight:500; }
  .klist { display:grid; gap:4px; }
  .krow { background:var(--card); border-radius:22px; padding:10px 14px; display:grid; grid-template-columns:minmax(0,1fr) 50px auto; gap:1px 8px; align-items:center; user-select:none; }
  .krow .k { grid-column:1; font-weight:400; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .krow .sp { grid-column:2; grid-row:1 / span 2; width:50px; height:20px; align-self:center; }
  .krow .kb { grid-column:3; font-weight:300; font-size:16px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-align:right; }
  .krow .d { grid-column:1; font-size:11px; font-weight:300; color:var(--hint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .krow .pill { grid-column:3; }
  .srow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; align-items:center; background:var(--card); border-radius:22px; padding:12px 14px; margin-bottom:8px; }
  .srow .k { font-weight:400; font-size:14px; overflow-wrap:anywhere; }
  .srow .q { grid-row:1 / span 2; grid-column:2; justify-self:end; font-size:26px; font-weight:200; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; }
  .srow .q small { font-size:11px; font-weight:300; color:var(--hint); letter-spacing:0; } .srow .q .no { color:var(--hint); }
  .srow .d, .srow .d2 { grid-column:1; font-size:11px; font-weight:300; color:var(--hint); }
  .srow .d2 .neg { font-weight:500; color:var(--bad); }
  .srow .pill { grid-column:2; grid-row:3; } .srow .d2 { grid-row:3; }
  .note { background:var(--idle-soft); color:var(--hint); border-radius:18px; padding:8px 14px; margin:0 0 10px; font-weight:300; font-size:12px; }
  .pill { justify-self:end; font-size:10px; font-weight:500; padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .p-ok { background:var(--ok-soft); color:var(--ok); } .p-wait { background:var(--wait-soft); color:var(--wait); } .p-acc { background:var(--acc-soft); color:var(--acc); }
  .p-bad { background:var(--bad-soft); color:var(--bad); } .p-idle { background:var(--idle-soft); color:var(--idle); } .p-minus { background:var(--minus-soft); color:var(--minus); }
  .hero .off { justify-self:start; background:none; border:0; padding:6px 0 0; flex:none; font:300 11px var(--f); color:#fff; text-decoration:underline; opacity:.9; }
  .kback { display:flex; align-items:center; gap:8px; font-weight:400; font-size:14px; margin:0 0 6px; }
  .kback i { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--card); font-style:normal; flex:none; }
  .kback span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus { display:grid; justify-items:center; text-align:center; gap:2px; padding:14px 0 16px; }
  .focus .fl { font-size:11px; font-weight:300; color:var(--hint); }
  .focus .fv { font-size:44px; font-weight:200; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .focus .fv small { font-size:16px; font-weight:300; color:var(--hint); letter-spacing:0; }
  .focus .fs { font-size:12px; font-weight:300; color:var(--hint); }
  .tl, .advice { margin-top:8px; background:var(--card); border-radius:24px; padding:12px 14px 4px; }
  .advice { padding-bottom:12px; display:grid; gap:4px; }
  .tl .l, .advice .l { font-size:10.5px; font-weight:400; color:var(--hint); margin-bottom:8px; }
  .advice .l { margin-bottom:0; }
  .advice .row2 { display:flex; align-items:center; gap:12px; margin-top:6px; user-select:none; }
  .ev { display:grid; grid-template-columns:42px 16px 1fr; gap:8px; align-items:start; padding-bottom:10px; }
  .ev .tm { font-size:12px; font-weight:300; color:var(--hint); font-variant-numeric:tabular-nums; padding-top:1px; }
  .ev .dot { width:12px; height:12px; border-radius:50%; margin-top:3px; justify-self:center; position:relative; }
  .ev:not(:last-child) .dot::after { content:""; position:absolute; left:5px; top:13px; width:2px; height:34px; background:var(--line); }
  .ev .tx { font-size:12.5px; font-weight:400; overflow-wrap:anywhere; }

  /* ---- главная, рекомендации, слова — стиль v2 ---- */
  .hero .minirow { display:flex; gap:6px; margin-top:6px; }
  .hero .minirow span { flex:1; background:rgba(255,255,255,.2); border-radius:14px; padding:6px 8px; font-size:10.5px; font-weight:300; display:grid; }
  .hero .minirow b { font-size:15px; font-weight:400; }
  .hero .big small { font-size:14px; font-weight:300; letter-spacing:0; }
  .hlist { display:grid; gap:6px; }
  .hrow, .word, .kc { -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .hrow { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:2px 10px; align-items:center; background:var(--card); border-radius:22px; padding:11px 14px; user-select:none; }
  .hrow .k { grid-column:2; font-size:13.5px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hrow .v { grid-column:3; font-size:16px; font-weight:300; text-align:right; font-variant-numeric:tabular-nums; }
  .hrow .d { grid-column:2; font-size:11px; font-weight:300; color:var(--hint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hrow .pill { grid-column:3; }
  .tag { display:inline-block; font-size:10px; font-weight:500; padding:1px 6px; border-radius:999px; background:var(--acc-soft); color:var(--acc); margin-left:4px; vertical-align:1px; }
  .ord { grid-column:1; grid-row:1 / span 2; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; align-content:center; line-height:1; position:relative; background:conic-gradient(var(--ring) calc(var(--p)*1%), var(--line) 0); }
  .ord::before { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--card-solid); }
  .ord b, .ord i { position:relative; font-style:normal; }
  .ord b { font-size:13px; font-weight:500; }
  .ord i { font-size:8px; font-weight:300; color:var(--hint); }
  .sec { font-size:11px; font-weight:400; color:var(--hint); margin:12px 4px 6px; text-transform:none; letter-spacing:0; }
  .todo2 { background:var(--card); border-radius:24px; padding:12px 14px; display:grid; gap:8px; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .todo2 .it { display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; align-items:start; font-size:13px; font-weight:500; overflow-wrap:anywhere; }
  .todo2 .it i { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:400; background:var(--bad-soft); color:var(--bad); }
  .todo2 .it i.ok { background:var(--ok-soft); color:var(--ok); }
  .todo2 .it small { display:block; font-weight:300; color:var(--hint); font-size:11.5px; }
  .todo2 .more { font-size:12px; font-weight:300; color:var(--hint); }
  .kc { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; align-items:center; background:var(--card); border-radius:22px; padding:11px 14px; margin-bottom:6px; }
  .kc .k { font-size:13.5px; font-weight:400; min-width:0; overflow-wrap:anywhere; }
  .kc .v { font-size:16px; font-weight:300; text-align:right; font-variant-numeric:tabular-nums; }
  .kc .d { font-size:11px; font-weight:300; color:var(--hint); }
  .kc .do { grid-column:1 / -1; font-size:12px; font-weight:300; color:var(--hint); margin-top:2px; }
  .kc .row2 { grid-column:1 / -1; display:flex; align-items:center; gap:10px; margin-top:6px; user-select:none; font-size:12.5px; font-weight:400; }
  .word { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; background:var(--card); border-radius:18px; padding:9px 12px; margin-bottom:6px; user-select:none; }
  .word.seen { background:transparent; border:1.5px dashed var(--line); margin-top:14px; }
  .word .w { font-size:13.5px; font-weight:400; min-width:0; overflow-wrap:anywhere; }
  .word .w small { display:block; font-size:11px; font-weight:300; color:var(--hint); }
  .word .n { font-size:12px; font-weight:300; color:var(--hint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .word .box, .kc .box { flex:0 0 20px; width:20px; height:20px; border-radius:7px; border:1.5px solid var(--hint); background:transparent; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:#fff; }
  .word.on .box { background:var(--acc); border-color:var(--acc); }

  /* сворачиваемые блоки в стиле v2: стеклянная строка и шеврон вместо системного треугольника */
  details > summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border-radius:18px; padding:10px 14px; font-size:13px; font-weight:400; color:var(--hint); }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::marker { content:""; }
  details > summary::after { content:"›"; font-size:18px; line-height:1; color:var(--hint); transition:transform .2s ease; }
  details[open] > summary::after { transform:rotate(90deg); }
  details[open] > summary { margin-bottom:6px; }
  @media (prefers-reduced-motion: reduce) { details > summary::after { transition:none; } }
  .seg2 { display:flex; gap:2px; background:var(--card); border-radius:999px; padding:3px; margin:0 0 10px; box-shadow:inset 0 0 0 1px var(--line); }
  .seg2 div { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 4px; border-radius:999px; font-size:12px; font-weight:400; color:var(--hint); white-space:nowrap; cursor:pointer; }
  .seg2 div.on { background:var(--on-bg); color:var(--on-fg,#1d1b19); font-weight:500; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .seg2 em { font-style:normal; font-size:10px; font-weight:500; min-width:16px; height:16px; padding:0 4px; border-radius:999px; display:inline-grid; place-items:center; background:var(--idle-soft,#efece8); color:var(--fg); }
  .seg2 div.on em { background:var(--acc); color:#fff; }
  .xrow { background:var(--card); border-radius:18px; padding:10px 14px; display:flex; justify-content:space-between; gap:10px; font-size:13px; font-weight:400; margin-bottom:6px; }
  .xrow span:last-child { color:var(--hint); font-weight:300; white-space:nowrap; }
  /* стартовый экран: скелет в стиле v2 вместо текста; нижняя панель скрыта до загрузки */
  .boot { display:grid; gap:8px; }
  .sk { border-radius:22px; background:var(--card); position:relative; overflow:hidden; }
  .sk::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:sk 1.4s ease-in-out infinite; }
  .dark .sk::after { background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent); }
  @keyframes sk { to { transform:translateX(100%); } }
  .sk.hero { height:132px; border-radius:30px; background:linear-gradient(135deg,var(--acc-soft),var(--card)); }
  .sk.row2 { height:58px; }
  .boot .bt { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:300; color:var(--hint); margin:4px 4px 2px; }
  .boot .sp { width:14px; height:14px; border-radius:50%; border:2px solid var(--acc-soft); border-top-color:var(--acc); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sk::after, .boot .sp { animation:none; } }
  .retry { margin-top:14px; border:0; border-radius:999px; padding:11px 22px; font:500 14px inherit; background:var(--acc); color:#fff; }

  /* 11.10 читаемость: карточки отделены от фона тонкой рамкой и тенью (на светлом сливались), подписи разделов крупнее и темнее */
  :root.light .row, :root.light .card, :root.light .tile, :root.light .todo, :root.light .hrow, :root.light .srow, :root.light .xrow,
  :root.light .bid, :root.light .camp, :root.light .advice, :root.light .tl, :root.light details > summary, :root.light .word {
    box-shadow:0 0 0 1px rgba(40,30,20,.06), 0 2px 8px rgba(40,30,20,.05); }
  .sec { font-size:12.5px !important; font-weight:500 !important; color:var(--fg) !important; opacity:.75; margin:16px 4px 8px !important; }
</style>
</head>
<body>
<div id="back">‹ Кампании</div>
<h1 id="title">Минус-слова</h1>
<div id="tabs"><div data-t="w"></div><div data-t="r"></div><div data-t="b"></div></div>
<p class="sub" id="sub">Отметь, что убрать из показов. Отмеченное уйдёт в кабинет после «Применить».</p>
<div id="list"></div>
<div id="toast"></div>
<div id="bar">
  <button id="cancel">Отмена</button>
  <button id="apply">Применить</button>
  <button id="pause" style="display:none">⏸ Пауза</button>
</div>
<script>
  var rkOpen = false;   // блок «Ключи конкурентов» остаётся раскрытым после ➕/✕
  var MIN_BID = 9500;   // минимальная ставка Uzum (Николай 19.10)
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var API = 'https://ulya.dacutavio.ru'; // 22.09.2026: свой домен за Cloudflare — прямой канал из РФ до IP хостинга режет ответ после ~16 КБ; старый https://165-22-76-154.sslip.io жив как запасной
  // Через Cloudflare из РФ часть соединений замирает после первых КБ (22.09: 24 КБ висит, 400 КБ проходит, через минуту наоборот).
  // Зависшее соединение браузер переиспользует, поэтому повтор идёт на ДРУГОЕ имя — это новое соединение и новый адрес Cloudflare.
  var API_HOSTS = ['https://ulya.dacutavio.ru', 'https://ulya2.dacutavio.ru', 'https://ulya3.dacutavio.ru'];
  var initData = (tg && tg.initData) || '';
  // Тема: внутри Telegram — по colorScheme, вне его (отладка) — по системной.
  // Ручной выбор темы (кнопка ☀︎/☾ рядом с «Обновить») главнее Telegram; хранится только у этого зрителя.
  var themePick = null;
  try { themePick = localStorage.getItem('ulya-theme'); } catch (e) {}
  function theme() {
    var inTg = tg && tg.platform && tg.platform !== 'unknown';
    var dark = themePick ? themePick === 'dark'
      : inTg ? tg.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.className = dark ? 'dark' : 'light';
  }
  function toggleTheme() {
    themePick = document.documentElement.className === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('ulya-theme', themePick); } catch (e) {}
    theme(); tap();
  }
  window.toggleTheme = toggleTheme;      // вызывается из onclick в строке «Данные на …»
  theme();
  if (tg) tg.onEvent('themeChanged', theme);

  var list = document.getElementById('list'), apply = document.getElementById('apply');
  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).style.display = on ? '' : 'none'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function num(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function dec(x) { return String(x).replace('.', ',').replace('-', '−'); }   // 26,3 и −0,8 — как в макете
  function tap() { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }
  function fail(msg) {
    list.innerHTML = '<div class="empty">' + msg + '</div>';
    show('bar', false); show('sub', false);
  }
  // Ответ сервера — чужой HTML: экранируем всё через esc(), затем возвращаем разрешённый
  // минимум тегов (b/i/code/br). Не regex-парсинг HTML — просто обратная замена жёстко
  // заданных экранированных форм, поэтому произвольный <img onerror> остаётся текстом.
  function safeHtml(s) {
    return esc(s)
      .replace(/&lt;(\/?)(b|i|code)&gt;/g, '<$1$2>')
      .replace(/\n/g, '<br>');
  }
  var toastTimer = null;
  function toast(html, kind) {
    var t = $('toast');
    clearTimeout(toastTimer);
    t.className = kind === 'ok' ? 'ok' : 'err';
    t.innerHTML = html;
    t.style.display = 'block';
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 6000);
  }

  // Данные едут в ссылке. ?z= — все кампании, deflate-raw + base64url (главный экран);
  // ?d= — одна кампания без сжатия (старые кнопки и запасной вход). Не в #: Telegram
  // подменяет фрагмент своим #tgWebAppData=… и пачка терялась.
  function bytes(b64) {
    var bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function load() {
    stock = null;   // REQ-001: режим ссылки (?z=/?d=) экран «Закуп» не несёт — не показываем стухшую кнопку
    var q = new URLSearchParams(location.search), z = q.get('z'), d = q.get('d');
    if (z) {
      if (!window.DecompressionStream) return Promise.reject('old');
      var st = new Blob([bytes(z)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(st).text().then(function (t) { var o = JSON.parse(t); (o.c || []).forEach(function (c) { if (o.t && !c.t) c.t = o.t; }); return o.c; });
    }
    return Promise.resolve(d ? [JSON.parse(new TextDecoder().decode(bytes(d)))] : null);
  }

  var all = [], data = null, items = [], cards = [], grow = [], bids = [], bidOn = {}, growOn = {}, tab = 'w', seen = false;
  var stock = null;   // REQ-001 uzum-stock-tab: {r,u,n,e,pos,pcs,sum,np} — только режим сервера, ссылка (?z=/?d=) его не несёт
  var rm = [], rmOn = {}, rmn = 0;   // rmn — сколько убрано ВСЕГО (сервер шлёт префикс rm, см. RM_SHOWN) // «Убрано из показов»: rm — [слово, перевод, дата, кто], rmOn — отмеченные на возврат
  var VERD = { e: 'Дорого', z: 'Без заказов', r: 'Рано судить', n: 'Нет маржи', h: 'Держать' };
  var mode = 'link'; // 'server' — данные и действия через API; 'link' — запасной, как раньше (?z=/?d=, sendData)

  // ---- режим сервера: авторизация подписью Telegram, без своих токенов/cookies
  // Таймауты: состояние на холодном кэше сервер собирает ~6–10 с (7 кампаний, перевод новых слов) — даём 25 с;
  // действие отвечает быстро, но шлёт сообщение в Telegram — 15 с. Дальше кэш сервера (90 с) отдаёт мгновенно.
  function fetchStateOnce(host, ms) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms);
    return fetch(host + '/api/state', { headers: { 'X-Tg-Init-Data': initData }, signal: ctl.signal })
      .then(function (r) {
        if (r.status === 401) return Promise.reject('auth');
        if (!r.ok) return Promise.reject('http');
        return r.json();                                   // тело тоже под таймером: зависает именно тело, не заголовки
      })
      .then(function (o) {
        clearTimeout(timer);
        var c = o.c || [];
        c.forEach(function (x) { if (o.t && !x.t) x.t = o.t; });
        stock = o.st || null;   // REQ-001: экран «Закуп» — только этот путь и гист-путь ниже несут 'st'
        return c;
      }, function (e) { clearTimeout(timer); return Promise.reject(e === 'auth' ? 'auth' : e === 'http' ? 'http' : (e && e.name === 'AbortError' ? 'timeout' : 'net')); });
  }
  // Первая попытка 15 с (холодная сборка на сервере 6–10 с), повторы по 12 с на других именах: дальше сервер отдаёт из кэша за миллисекунды,
  // так что долгий повтор = снова зависшая доставка, а не сервер. 'auth'/'http' не повторяем — это не сеть.
  function fetchStateDirect() {
    var attempt = 0;
    function go() {
      var host = API_HOSTS[attempt % API_HOSTS.length], ms = attempt === 0 ? 15000 : 12000;
      attempt += 1;
      return fetchStateOnce(host, ms).catch(function (e) {
        if ((e === 'timeout' || e === 'net') && attempt < API_HOSTS.length) {
          list.innerHTML = '<div class="empty">Связь застряла, пробую ещё раз (' + (attempt + 1) + ' из ' + API_HOSTS.length + ')…</div>';
          return go();
        }
        return Promise.reject(e);
      });
    }
    return go();
  }

  // ---- состояние через GitHub Gist (22.09.2026, uzum-app-state-via-github.md): большие ответы сервера
  // срезаются из РФ после ~16 КБ, GitHub грузится всегда. Сервер отдаёт маленькую ссылку+ключ (/api/state_ref),
  // само тело — зашифрованный файл с GitHub. Любой сбой на пути (а)-(в) → тихо назад на старый /api/state.
  function fetchRef(fresh) {
    // 60 с, не 20: после записи сервер собирает список заново 18–26 с (23.10) — на 20 с приложение уходило на запасной экран с 5 словами
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 60000);
    var url = API + '/api/state_ref' + (fresh ? '?fresh=1' : '');
    return fetch(url, { headers: { 'X-Tg-Init-Data': initData }, signal: ctl.signal })
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401) return Promise.reject('auth');
        if (!r.ok) return Promise.reject('http');
        return r.json();
      }, function (e) { clearTimeout(timer); return Promise.reject(e && e.name === 'AbortError' ? 'timeout' : 'net'); });
  }
  function fetchGistBody(url) {
    // 45 с, не 20: у Вики 22.09 файл 150 КБ с GitHub не успевал за 20 с, хотя в Safari та же ссылка открывалась — сеть медленная, не мёртвая.
    list.innerHTML = '<div class="empty">Скачиваю данные с GitHub…<br><span style="font-size:13px">до 45 секунд на медленной сети</span></div>';
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 45000);
    return fetch(url, { signal: ctl.signal })                // без своих заголовков — CORS gist raw отдаёт *, свои заголовки его бы сломали
      .then(function (r) { clearTimeout(timer); if (!r.ok) return Promise.reject('http'); return r.text(); },
            function (e) { clearTimeout(timer); return Promise.reject(e && e.name === 'AbortError' ? 'timeout' : 'net'); });
  }
  function decryptState(b64, keyB64) {
    var raw = bytes(b64), nonce = raw.slice(0, 12), ct = raw.slice(12);
    return crypto.subtle.importKey('raw', bytes(keyB64), 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function fetchStateViaGist(fresh) {
    return fetchRef(fresh).then(function (ref) {
      return fetchGistBody(ref.u).then(function (b64) { return decryptState(b64, ref.k); })
        .then(function (o) {
          var c = o.c || [];
          c.forEach(function (x) { if (o.t && !x.t) x.t = o.t; });
          stock = o.st || null;
          return c;
        });
    });
  }
  // Главный путь: сервер публикует состояние в Gist → приложение читает его напрямую с GitHub. Сбой
  // на любом шаге (ссылка сервера, GitHub, расшифровка) — тихо на старый прямой путь /api/state.
  function fetchState(fresh) {
    return fetchStateViaGist(fresh).catch(function () {
      list.innerHTML = '<div class="empty">GitHub не ответил, пробую сервер…</div>';
      return fetchStateDirect();
    });
  }

  // ДРР везде ОДИН и тот же — тот, что в карточке: вся реклама / все заказы товара (склейки,
  // если вариантов в карточке больше одного). hd[2] — другое число: расход на заказы С РЕКЛАМЫ,
  // оно в разы выше (реклама почти выключена, а 14-дневный расход остался) и как «ДРР» врёт.
  // Нет ph (старый сервер) — честно нет ДРР, а не подстановка чужого числа.
  function drr(c) {
    var ph = c && c.ph;
    if (!ph) return null;
    return ph[6] > 1 && ph[7] != null ? ph[7] : ph[0];
  }

  // 3 — ДРР товара выше маржи в % цены, 2 — есть «дорого» или «сливает» (w=1), 1 — есть слова, 0 — спокойно
  function sev(c) {
    var hd = c.hd || [], d = drr(c);
    if (d != null && hd[3] != null && d > hd[3]) return 3;
    if ((c.k || []).some(function (x) { return x[4] === 'e' || x[6]; })) return 2;
    return (c.i || []).length ? 1 : 0;
  }

  // Данные вшиты в ссылку и сами не обновляются: показываем, на какое время они собраны, и предупреждаем о старых.
  // t — минуты эпохи; в старых ссылках его нет — тогда честно говорим, что список из старого сообщения.
  function freshness(t) {
    var btn = ' <a href="#" class="rf" onclick="return false">↻ Обновить</a> <a href="#" class="rf th" onclick="toggleTheme();return false" aria-label="Сменить тему">☀︎/☾</a>';
    if (!t) return '<div class="stale">Список из старого сообщения — ключи и ставки могли измениться.' + btn + '</div>';
    var age = Math.round(Date.now() / 60000 - t), d = new Date(t * 60000);
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return age > 60 ? '<div class="stale">Данные на ' + hm + ' — списку больше часа, ключи и ставки могли измениться.' + btn + '</div>'
                    : '<p class="head" style="margin-top:-4px">Данные на ' + hm + '' + btn + '</p>';
  }

  // Плашка статуса кампании (T5, 23.09): cs = [статус, "дд.мм" начала статуса, остаток дня, остаток недели].
  // Сервер шлёт cs, только когда есть хотя бы один снимок бюджета; ACTIVE — плашки нет, ставки живые.
  function statusBanner() {
    var cs = data && data.cs;
    if (!cs || cs[0] === 'ACTIVE') return '';
    var label = cs[0] === 'PAUSED' ? 'Кампания на паузе' : cs[0] === 'LIMIT_REACHED' ? 'Дневной бюджет исчерпан' : 'Статус: ' + cs[0];
    return '<div class="stale">⏸ ' + label + (cs[1] ? ' с ' + cs[1] : '') + '</div>';
  }

  // ---- главный экран: список кампаний, проблемные сверху
  function home() {
    data = null;
    if (tg && tg.BackButton) tg.BackButton.hide();
    show('back', false); show('tabs', false); show('sub', false); show('bar', false);
    var total = all.reduce(function (s, c) { return s + ((c.hd || [])[0] || 0); }, 0);
    var ordersAll = all.reduce(function (s, c) { return s + ((c.hd || [])[1] || 0); }, 0);
    var hasCn = all.some(function (c) { return c.cn; });
    // «Ждут тебя» — решения по ставкам и ключам; кандидаты в минус (до 200 на кампанию) видны внутри кампании (11.10: было 1110)

      '<a href="#" class="th hth" onclick="toggleTheme();return false" aria-label="Сменить тему">☀︎/☾</a>' +
      '<span class="t">Расход по отчётам · ' + all.length + ' кампаний</span><span class="big">' + num(total) +
      '<small> сум</small></span><div class="minirow">' + plates + '</div>' +
      (fresh ? '<span class="nx">данные на ' + hm + ' · <a href="#" class="rf" onclick="return false">обновить</a></span>' : '') + '</div>';
    // REQ-002 uzum-stock-tab: кнопка «Закуп» рядом со списком кампаний, бейдж — позиций к заказу.
    // stock может быть null (сбой остатков внутри state_json — fail-open) или пустым (r/u/n все пустые) — тогда не показываем.
    if (stock && (stock.r.length || stock.u.length || stock.n.length)) {
      var sb = document.createElement('div');

      sb.innerHTML = '<div class="body"><div class="nm">📦 Закуп</div><div class="n">' +

    }
    var sec = document.createElement('p'); sec.className = 'sec'; sec.textContent = 'Кампании · сначала, где дороже'; list.appendChild(sec);
    all.map(function (c, i) { return [c, i]; })
      .sort(function (a, b) { return sev(b[0]) - sev(a[0]) || ((b[0].hd || [])[0] || 0) - ((a[0].hd || [])[0] || 0); })
      .forEach(function (p) {
        var c = p[0], s = sev(c), hd = c.hd || [], w = (c.i || []).length, d = drr(c);
        var bad = (c.k || []).filter(function (x) { return x[4] === 'e'; }).length;
        var waste = (c.k || []).filter(function (x) { return x[6]; }).length;
        var lbl2 = bad ? 'Дорого' + (bad > 1 ? ' · ' + bad : '') : 'Сливает' + (waste > 1 ? ' · ' + waste : '');
        var paused = c.cs && c.cs[0] !== 'ACTIVE';
        var pill = s === 3 ? ['ДРР ' + dec(d) + '%', 'bad'] : s === 2 ? [lbl2, 'wait'] : s === 1 ? ['Слова · ' + w, 'idle'] : ['Спокойно', 'ok'];
        // макет v2: пауза — серой строкой, справа ДРР; вторая строка короткая — маржа (если в минус) и органика
        if (paused && d != null) pill = ['ДРР ' + dec(d) + '%', d <= 5 ? 'ok' : 'bad'];
        var parts = [];
        if (paused) parts.push('⏸ ' + (c.cs[0] === 'PAUSED' ? 'на паузе' : c.cs[0] === 'LIMIT_REACHED' ? 'бюджет исчерпан' : c.cs[0]));
        if (s === 3) parts.push('маржа ' + dec(hd[3]) + '%');
        if (c.ph && c.ph[2]) parts.push('органика ' + c.ph[2] + '-е');
        // кольцо: путь к целевому ДРР 5% (p = 100, если уже в цели); цвет — ok ≤5%, wait — «Дорого»/нет ДРР, bad >5%
        var pc = d == null ? 0 : d <= 5 ? 100 : Math.round(500 / d);

          '<span class="k">' + esc(c.dn || c.n || '?') + (c.a ? '<span class="tag">авто</span>' : '') + '</span>' +
          '<span class="v">' + (hd.length ? num(hd[0]) : '') + '</span>' +

  var stockSec = 'r';

      var hn = document.createElement('p'); hn.className = 'n'; hn.style.cssText = 'color:var(--hint);margin:6px 4px'; hn.textContent = 'скорость посчитаю с первых продаж'; list.appendChild(hn);

      d.innerHTML = '<div class="k">' + esc(label) + '</div>' +

  // ---- вкладка «Рекомендации»: k = [ключ, расход, заказы, цена заказа, вердикт, порог ставки, сливает?]
  // g = [запрос, заказы, клики] — свои подсказки, никаких кнопок действия
  function renderCards() {
    list.innerHTML = freshness(data.t) + statusBanner();

    if (hd || ph) {

      if (bo) meta.push('выкуп ' + ph[10] + '%' + (ph[11] != null ? ' ' + (['по товару', 'по магазину', 'из кабинета'][ph[11]] || '') : ''));
      if (meta.length) {

          (glued ? 'ДРР карточки ' + (ph[0] == null ? 'н/д' : ph[0] + '%') + '<br>' : '') +
          (glued && ph[9] ? 'Рекламных заказов больше, чем продаж этого варианта — покупатели берут соседние; по карточке реклама даёт ' + Math.round(ph[8]) + '% заказов'
            : ph[1] != null ? 'Реклама даёт ' + Math.round(ph[1]) + '% заказов' + (glued && ph[8] != null ? ' (по карточке ' + Math.round(ph[8]) + '%)' : '') : '') : '') +

      var rpChip = { off: 'Выключен', on: 'Работает', paused: 'Пауза', stopped: 'Остановлен', done: 'Выполнено', na: 'Недоступен', busy: 'Недоступен' }[rp.st] || rp.st;

        (rp.st === 'busy' ? '<div class="do" style="margin-top:6px;font-weight:400">Недоступен: у варианта ' + esc(rp.busy_with || '') + ' идёт цикл</div>'

        (rp.next ? '<div class="do" style="margin-top:6px;font-weight:400;color:var(--hint)">Решение ' + esc(rp.next) + '</div>' : '') +
        '<details style="margin-top:6px;font-size:13px;color:var(--hint)"><summary style="cursor:pointer;font-weight:600">как работает</summary>' +
        '<div style="margin-top:4px;line-height:1.5">+1% раз в 4 дня. Упали продажи больше чем на 30% — верну цену, остановлюсь и позову Вику. Потолок +20%. В акции Uzum цену менять нельзя — жду конца акции и трёх дней без неё</div></details>';
      if (rp.st !== 'na' && rp.st !== 'busy') {
        var rpBtn = document.createElement('button');
        rpBtn.style.cssText = 'margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px;font-weight:600;font-size:15px;background:' +

    // «Что сделать»: максимум три строки, по убыванию денег — ответ одним взглядом, без
    // чтения карточек (Николай, 18.09: «не словесным поносом»). Всё считается из того же payload.
    var acts = [];

      }
      var html = j.text ? safeHtml(j.text) : 'Готово.';
      if (j.chat) html += '<br>→ подтверди кнопкой в чате с Улей' + (tg && tg.close ? ' <button id="toChat">Перейти в чат</button>' : '');
      toast(html, 'ok');
      if (tg && tg.close) { var tb = $('toast').querySelector('#toChat'); if (tb) tb.onclick = function () { tg.close(); }; }
      afterSend(o, !!j.refresh);
    }, function (e) {
      toast(e === 'auth' ? 'Подпись устарела — открой приложение заново из меню Ули.' : 'Сервер не ответил, попробуй ещё раз.', 'err');
      afterSend(o, false);
    });
    function afterSend(o, forceRefresh) {
      apply.disabled = false; apply.textContent = prevText;
      var needsRefresh = forceRefresh || o.cancel || o.checked || o.unminus || o.repricer === false;   // остановка репрайсера исполняется сразу — перечитать состояние
      // Запись в кабинет делает бот ~5 с ПОСЛЕ ответа сервера (22.09: минус-слова Вики «не убрались» — данные перечитались за 3 с до
      // конца записи). Ждём 8 с, потом свежие данные; «↻ Обновить» доступна, если бот задержался дольше.
      if (needsRefresh && (o.checked || o.bids || o.unminus)) {
        list.innerHTML = '<div class="empty">Записываю в кабинет…<br><span style="font-size:13px">обновлю список через несколько секунд</span></div>';
        setTimeout(refreshInPlace, 8000);
      } else if (needsRefresh) refreshInPlace();
    }
  }
  // Пауза и справка только ПРОСЯТ бота: пауза исполняется кнопкой подтверждения в чате
  $('pause').onclick = function () { send({ pause: true }); };
  apply.onclick = function () {
    if (tab === 'b') {       // ставки: шлём только номера строк — ключи и цифры бот берёт из своей базы
      send({ bids: Object.keys(bidOn).filter(function (k) { return bidOn[k]; }).map(Number) });
      return;
    }
    var rmWords = Object.keys(rmOn).filter(function (k) { return rmOn[k]; }).map(function (i) { return rm[i][0]; });
    if (rmWords.length) { send({ unminus: rmWords }); return; }
    var checked = items.map(function (it, i) { return it.on ? i : -1; }).filter(function (i) { return i >= 0; });
    send({ checked: checked, seen: seen && checked.length < items.length });
  };
  $('cancel').onclick = function () { if (all.length > 1) home(); else send({ cancel: true }); };
  function goBack() { if (cur != null) { cur = null; render(); window.scrollTo(0, 0); } else home(); }
  function setBack() {   // экран ключа — внутри кампании, назад возвращает в список ключей
    if (!(tg && tg.BackButton)) return;
    if (cur != null || all.length > 1) tg.BackButton.show(); else tg.BackButton.hide();
  }
  $('back').onclick = goBack;
  if (tg && tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(goBack);

  function boot(list_) {
    all = (list_ || []).filter(function (x) { return x && ((x.i && x.i.length) || (x.k && x.k.length) || (x.s && x.s.length) || x.a); });
    if (!all.length) return fail('Список не загрузился. Закрой и открой заново из сообщения бота.');
    if (all.length === 1) open(0); else home();
  }
  function retryScreen(msg) {
    list.innerHTML = '<div class="empty">' + esc(msg) + '<br><button id="retry" class="retry">Повторить</button></div>';
    show('bar', false); show('sub', false);
    $('retry').onclick = startServer;
  }
  function startServer() {
    $('title').textContent = 'Реклама Uzum'; show('sub', false); show('bar', false);
    list.innerHTML = '<div class="boot"><div class="bt"><span class="sp"></span>Загружаю свежие данные — первый раз за день до 10 секунд</div>' +
      '<div class="sk hero"></div><div class="sk row2"></div><div class="sk row2"></div><div class="sk row2"></div><div class="sk row2"></div></div>';
    fetchState().then(function (c) { mode = 'server'; boot(c); }, function (e) {
      load().then(function (c) {   // сервер недоступен — если в ссылке есть данные, тихо уходим в запасной режим
        if (c && c.length) {
          mode = 'link';
          boot(c);
          var pl = document.createElement('div'); pl.className = 'stale';
          pl.textContent = 'Сервер не ответил — показываю данные из ссылки.';
          list.insertBefore(pl, list.firstChild);
        } else if (e === 'auth') {
          fail('Подпись устарела. Открой приложение заново из меню Ули.');
        } else {
          retryScreen('Не получилось загрузить данные. Проверь VPN и открой ещё раз.');
        }
      }, function () {
        if (e === 'auth') fail('Подпись устарела. Открой приложение заново из меню Ули.');
        else retryScreen('Не получилось загрузить данные. Проверь VPN и открой ещё раз.');
      });
    });
  }

  if (initData) {
    startServer();
  } else {
    var q0 = new URLSearchParams(location.search);
    if (q0.get('api') === '1' && !q0.get('z') && !q0.get('d')) {
      fail('Открой приложение из Telegram — кнопкой меню у Ули.');
    } else {
      load().then(boot, function (e) {
        fail(e === 'old' ? 'Этот телефон не умеет открыть общий список. Напиши боту «минус-слова» и название кампании — откроется одна кампания.'
                         : 'Список не загрузился. Закрой и открой заново из сообщения бота.');
      });
    }
  }
})();
</script>
</body>
